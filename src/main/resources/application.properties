server.port=9090
spring.datasource.url=jdbc:mysql://localhost:3306/tutorial_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.web.resources.add-mappings=true
spring.web.resources.chain.strategy.enabled=true
management.endpoints.web.exposure.include=health,info,startup,metrics,prometheus
management.endpoint.health.show-details=always

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Spring AI Ollama Configuration (Free, runs locally!)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:1b
spring.ai.ollama.chat.options.temperature=0.7

# JWT Configuration
jwt.secret=your-secret-key-here-please-change-this-to-something-secure-and-long
jwt.expiration=86400000